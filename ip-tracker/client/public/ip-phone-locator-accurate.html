<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Tracker & Accurate Geo-Locator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { 
            font-family: system-ui, Arial, sans-serif; 
            background: #f4f7fa; 
            color: #0f172a; 
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 { 
            text-align: center; 
            color: #0369a1;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 14px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover { 
            background: #0369a1;
        }

        button.accurate-btn {
            background: #0ea5a2;
        }

        button.accurate-btn:hover {
            background: #0c8281;
        }

        pre {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            overflow: auto;
            margin: 15px 0;
        }

        #map {
            height: 400px;
            border-radius: 12px;
            margin-top: 20px;
            border: 2px solid #e2e8f0;
        }

        .popup-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0369a1;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
            z-index: 9999;
            font-size: 14px;
        }

        .popup-box.show {
            opacity: 1;
        }

        .hint {
            color: #64748b;
            font-size: 14px;
            margin-top: 8px;
        }

        .accuracy-indicator {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 8px;
        }

        .accuracy-high {
            background: #dcfce7;
            color: #166534;
        }

        .accuracy-medium {
            background: #fef9c3;
            color: #854d0e;
        }

        .accuracy-low {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 IP Tracker & Accurate Geo-Locator</h1>

        <div class="card">
            <h3>IP & Location Lookup</h3>
            <div class="input-group">
                <input id="ipInput" placeholder="Enter IPv4 address or leave blank for your own IP" />
                <div class="hint">
                    • For best results with Indian IPs, try multiple location refreshes
                    <br/>
                    • Examples: 103.153.154.2 (Airtel), 125.16.134.214 (Tata), 182.79.223.114 (Jio)
                </div>
            </div>

            <div class="button-group">
                <button id="btnLookupIP">
                    <span>🔍 Lookup IP</span>
                </button>
                <button id="btnAccurate" class="accurate-btn">
                    <span>📍 Find Accurate Location</span>
                </button>
            </div>

            <div id="ipOutput">
                <pre id="ipJSON">{ "status": "waiting for input..." }</pre>
                <div id="map"></div>
            </div>
        </div>

        <div class="popup-box" id="popupBox">Fetching accurate location...</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const ipInput = document.getElementById("ipInput");
        const btnLookupIP = document.getElementById("btnLookupIP");
        const btnAccurate = document.getElementById("btnAccurate");
        const ipJSON = document.getElementById("ipJSON");
        const popup = document.getElementById("popupBox");

        let map, marker;
        let attempts = 0;
        let lastLat, lastLon;

        function showPopup(message, duration = 2000) {
            popup.textContent = message;
            popup.classList.add("show");
            setTimeout(() => popup.classList.remove("show"), duration);
        }

        function getAccuracyLevel(data, attempts) {
            if (!data.latitude || !data.longitude) return 'low';
            if (attempts > 2 && data.city && data.region) return 'high';
            if (data.city && data.region) return 'medium';
            return 'low';
        }

        function getAccuracyBadge(level) {
            const badges = {
                high: '<span class="accuracy-indicator accuracy-high">High Accuracy</span>',
                medium: '<span class="accuracy-indicator accuracy-medium">Medium Accuracy</span>',
                low: '<span class="accuracy-indicator accuracy-low">Low Accuracy</span>'
            };
            return badges[level] || badges.low;
        }

        function isReservedIP(ip) {
            if (!ip) return false;
            const parts = ip.split('.').map(x => parseInt(x));
            if (parts[0] === 10) return true;
            if (parts[0] === 192 && parts[1] === 168) return true;
            if (parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31) return true;
            if (parts[0] === 100 && parts[1] >= 64 && parts[1] <= 127) return true;
            return false;
        }

        async function lookupIP(ip) {
            const url = ip ? `https://ipapi.co/${ip}/json/` : "https://ipapi.co/json/";
            const res = await fetch(url);
            const data = await res.json();
            return data;
        }

        function updateMap(lat, lon, data) {
            if (!lat || !lon) return;

            const popupContent = `
                <div style="text-align: center">
                    <strong>${data.city || 'Unknown City'}, ${data.region || 'Unknown Region'}</strong>
                    <br/>
                    <small>${data.org || 'Unknown ISP'}</small>
                    <br/>
                    <small>Lat: ${lat}, Lon: ${lon}</small>
                </div>
            `;

            if (!map) {
                map = L.map("map").setView([lat, lon], 12);
                L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);
                marker = L.marker([lat, lon]).addTo(map)
                    .bindPopup(popupContent)
                    .openPopup();
            } else {
                map.setView([lat, lon], 12);
                marker.setLatLng([lat, lon])
                    .bindPopup(popupContent)
                    .openPopup();
            }
        }

        async function showIPResult(ip, isAccurateAttempt = false) {
            try {
                if (isReservedIP(ip)) {
                    ipJSON.textContent = JSON.stringify({
                        error: "This IP is in a reserved range and cannot be geolocated",
                        suggestion: "Try a public IP address instead"
                    }, null, 2);
                    return;
                }

                if (isAccurateAttempt) {
                    attempts++;
                    showPopup(`Attempt ${attempts}: Refreshing location...`);
                }

                const data = await lookupIP(ip);
                const accuracyLevel = getAccuracyLevel(data, attempts);

                const obj = {
                    status: "success",
                    ip: data.ip,
                    country: data.country_name,
                    region: data.region,
                    city: data.city,
                    lat: data.latitude,
                    lon: data.longitude,
                    isp: data.org,
                    timezone: data.timezone,
                    accuracy_level: accuracyLevel
                };

                ipJSON.textContent = JSON.stringify(obj, null, 2);
                updateMap(obj.lat, obj.lon, data);

                if (isAccurateAttempt) {
                    const message = accuracyLevel === 'high' 
                        ? '✅ High accuracy location found!' 
                        : '📍 Location updated - try again for better accuracy';
                    showPopup(message);
                }

                lastLat = obj.lat;
                lastLon = obj.lon;

            } catch (error) {
                ipJSON.textContent = JSON.stringify({
                    error: "Failed to fetch location data",
                    message: error.message
                }, null, 2);
                showPopup("❌ Error fetching location");
            }
        }

        btnLookupIP.onclick = () => {
            attempts = 0;
            showIPResult(ipInput.value.trim());
        };

        btnAccurate.onclick = async () => {
            await showIPResult("", true);
        };

        // Initial demo with an Indian IP
        window.onload = () => showIPResult("103.153.154.2");
    </script>
</body>
</html>
